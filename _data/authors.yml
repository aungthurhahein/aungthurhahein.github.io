## Template › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/advanced-usage.md#setting-author-url
# -------------------------------------
# {author_id}:
#   name: {full name}
#   twitter: {twitter_of_author}
#   url: {homepage_of_author}
# -------------------------------------

Aung:
  name: Aung
  twitter: steve_a150
  url: https://twitter.com/steve_a150

# Posts use `author: aung` (lowercase). Keys are case-sensitive, so this entry
# fixes the JSON-LD author name while keeping the visible byline unchanged.
aung:
  name: Aung 🥷🏻
